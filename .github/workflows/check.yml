name: Source and verifier checks
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff
      - run: python -m unittest discover -s challenges/01-isaac-warehouse-patrol/tests
      - run: python -m unittest discover -s deliverables/v02/tests
      - run: ruff check --select F,E9 challenges/01-isaac-warehouse-patrol
      - run: ruff check --select F,E9 deliverables/v02
      - run: ruff check --select F,E9 deliverables/v03
      - run: |
          for script in challenges/01-isaac-warehouse-patrol/scripts/*.sh; do
            bash -n "$script"
          done
  semantic-proposal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy scipy Pillow PyYAML ruff
      - run: python -m unittest discover -s challenges/02-semantic-inspection/tests
      - run: ruff check --select F,E9 challenges/02-semantic-inspection
# GPU, licensed Isaac install, online USD and authenticated Native model runs
# are deliberately local integration tests; CI does not claim physical success.
